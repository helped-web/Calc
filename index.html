<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Прайс-калькулятор сервисного центра</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0F1216" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin:0; padding:0; background:#0F1216; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

const colors = {
  bg: "#0F1216",
  panel: "#161A20",
  panelAlt: "#1B2028",
  border: "#262C35",
  borderSoft: "#20252D",
  text: "#E9EBEE",
  textMuted: "#8A93A1",
  textFaint: "#5B6472",
  accent: "#4FD8C4",
  accentDim: "#2E8A7C",
  amber: "#F5A524",
  red: "#F16063",
};

const CUR = "BYN";

function Field({ label, value, onChange, suffix, min = 0, hint }) {
  return (
    <label className="flex flex-col gap-1.5">
      <span
        className="text-xs uppercase tracking-wide"
        style={{ color: colors.textMuted, fontFamily: "'Manrope', sans-serif", fontWeight: 600 }}
      >
        {label}
      </span>
      <div
        className="flex items-center rounded-lg border overflow-hidden"
        style={{ background: colors.panelAlt, borderColor: colors.border }}
      >
        <input
          type="number"
          min={min}
          value={value}
          onChange={(e) => onChange(e.target.value)}
          className="w-full bg-transparent outline-none px-3 py-2.5 text-base"
          style={{ color: colors.text, fontFamily: "'IBM Plex Mono', monospace" }}
        />
        {suffix && (
          <span
            className="px-3 text-sm shrink-0 text-right"
            style={{ color: colors.textFaint, fontFamily: "'IBM Plex Mono', monospace" }}
          >
            {suffix}
          </span>
        )}
      </div>
      {hint && (
        <span className="text-xs" style={{ color: colors.textFaint }}>
          {hint}
        </span>
      )}
    </label>
  );
}

function Section({ label, children }) {
  return (
    <div
      className="rounded-2xl border p-4 flex flex-col gap-3"
      style={{ background: colors.panel, borderColor: colors.borderSoft }}
    >
      <div className="flex items-center gap-2">
        <span className="inline-block w-1.5 h-1.5 rounded-full" style={{ background: colors.accent }} />
        <span
          className="text-xs uppercase tracking-widest"
          style={{ color: colors.accent, fontFamily: "'IBM Plex Mono', monospace", fontWeight: 600 }}
        >
          {label}
        </span>
      </div>
      {children}
    </div>
  );
}

function RepairPriceCalculator() {
  const [serviceName, setServiceName] = useState("");
  const [masterType, setMasterType] = useState("margin_share");
  const [hourlyRate, setHourlyRate] = useState("25");
  const [hours, setHours] = useState("1");
  const [pieceRate, setPieceRate] = useState("50");
  const [masterMarginShare, setMasterMarginShare] = useState("30");
  const [partsCost, setPartsCost] = useState("100");
  const [rentMonthly, setRentMonthly] = useState("2000");
  const [ordersMonthly, setOrdersMonthly] = useState("120");
  const [taxPercent, setTaxPercent] = useState("6");
  const [acquiringPercent, setAcquiringPercent] = useState("2");
  const [marginPercent, setMarginPercent] = useState("20");
  const [showBreakdown, setShowBreakdown] = useState(false);
  const [ticketNo] = useState(() => String(Math.floor(1000 + Math.random() * 8999)));

  const calc = useMemo(() => {
    const n = (v) => (v === "" || v === undefined ? 0 : Number(v) || 0);
    const _hourlyRate = n(hourlyRate), _hours = n(hours), _pieceRate = n(pieceRate);
    const _masterMarginShare = n(masterMarginShare), _partsCost = n(partsCost);
    const _rentMonthly = n(rentMonthly), _ordersMonthly = n(ordersMonthly);
    const _taxPercent = n(taxPercent), _acquiringPercent = n(acquiringPercent), _marginPercent = n(marginPercent);

    const rentPerOrder = _ordersMonthly > 0 ? _rentMonthly / _ordersMonthly : 0;
    const directMasterCost = masterType === "hourly" ? _hourlyRate * _hours : masterType === "piece" ? _pieceRate : 0;

    // Fixed costs that must be covered before margin, tax and acquiring cuts of the price.
    const fixedCosts = _partsCost + rentPerOrder + directMasterCost;
    const deductionPercent = _taxPercent + _acquiringPercent + _marginPercent;
    const valid = deductionPercent < 100;
    const price = valid ? fixedCosts / (1 - deductionPercent / 100) : null;

    const taxAmount = valid ? (price * _taxPercent) / 100 : 0;
    const acqAmount = valid ? (price * _acquiringPercent) / 100 : 0;
    const marginAmount = valid ? (price * _marginPercent) / 100 : 0;

    let masterAmount = directMasterCost;
    let ownerAmount = marginAmount;
    if (masterType === "margin_share") {
      masterAmount = (marginAmount * _masterMarginShare) / 100;
      ownerAmount = marginAmount - masterAmount;
    }

    return { rentPerOrder, fixedCosts, deductionPercent, valid, price, taxAmount, acqAmount, marginAmount, masterAmount, ownerAmount };
  }, [masterType, hourlyRate, hours, pieceRate, masterMarginShare, partsCost, rentMonthly, ordersMonthly, taxPercent, acquiringPercent, marginPercent]);

  const fmt = (n) => new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 }).format(Math.round((n || 0) * 100) / 100);

  return (
    <div style={{ background: colors.bg, minHeight: "100vh" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
        @keyframes pulseDot {
          0%, 100% { box-shadow: 0 0 0 0 rgba(79,216,196,0.55); }
          70% { box-shadow: 0 0 0 6px rgba(79,216,196,0); }
        }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { opacity: 0.5; }
        input:focus { outline: none; }
      `}</style>

      <div className="max-w-2xl mx-auto px-4 py-8 md:py-12">
        <div className="mb-7">
          <div
            className="text-xs uppercase tracking-widest mb-2"
            style={{ color: colors.accent, fontFamily: "'IBM Plex Mono', monospace", fontWeight: 600 }}
          >
            ⌁ сервис-центр · ремонт техники
          </div>
          <h1
            className="text-3xl md:text-4xl mb-1"
            style={{ color: colors.text, fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700 }}
          >
            Прайс-калькулятор
          </h1>
          <p className="text-sm" style={{ color: colors.textMuted }}>
            Себестоимость заказа → цена для клиента, в белорусских рублях.
          </p>
        </div>

        <div className="grid gap-5 md:grid-cols-[1fr_320px] items-start">
          {/* Inputs */}
          <div className="flex flex-col gap-4 order-2 md:order-1">
            <Section label="Мастер">
              <div className="flex gap-2">
                {[
                  { key: "margin_share", label: "% от маржи" },
                  { key: "hourly", label: "Почасовая" },
                  { key: "piece", label: "Сдельная" },
                ].map((opt) => (
                  <button
                    key={opt.key}
                    onClick={() => setMasterType(opt.key)}
                    className="flex-1 rounded-lg py-2 text-xs transition-colors"
                    style={{
                      fontFamily: "'Manrope', sans-serif",
                      fontWeight: 600,
                      background: masterType === opt.key ? colors.accentDim : colors.panelAlt,
                      color: masterType === opt.key ? "#EAFBF8" : colors.textMuted,
                      border: `1px solid ${masterType === opt.key ? colors.accent : colors.border}`,
                    }}
                  >
                    {opt.label}
                  </button>
                ))}
              </div>

              {masterType === "margin_share" && (
                <Field
                  label="Доля мастера от маржи"
                  suffix="% от маржи"
                  value={masterMarginShare}
                  onChange={setMasterMarginShare}
                  hint="Мастер получает эту долю от заложенной в цену маржи, остальное — ваша прибыль"
                />
              )}
              {masterType === "hourly" && (
                <div className="grid grid-cols-2 gap-3">
                  <Field label="Ставка" suffix={`${CUR}/ч`} value={hourlyRate} onChange={setHourlyRate} />
                  <Field label="Время ремонта" suffix="ч" value={hours} onChange={setHours} />
                </div>
              )}
              {masterType === "piece" && (
                <Field label="Оплата мастеру за заказ" suffix={CUR} value={pieceRate} onChange={setPieceRate} />
              )}
            </Section>

            <Section label="Запчасти">
              <Field label="Стоимость запчастей и материалов" suffix={CUR} value={partsCost} onChange={setPartsCost} />
            </Section>

            <Section label="Аренда и коммунальные">
              <div className="grid grid-cols-2 gap-3">
                <Field label="Аренда" suffix={`${CUR}/мес`} value={rentMonthly} onChange={setRentMonthly} />
                <Field label="Заказов" suffix="в мес" value={ordersMonthly} onChange={setOrdersMonthly} />
              </div>
              <span className="text-xs" style={{ color: colors.textFaint }}>
                ≈ {fmt(calc.rentPerOrder)} {CUR} накладных на один заказ
              </span>
            </Section>

            <Section label="Налоги и комиссии">
              <div className="grid grid-cols-2 gap-3">
                <Field label="Налог" suffix="% от цены" value={taxPercent} onChange={setTaxPercent} />
                <Field label="Эквайринг" suffix="% от цены" value={acquiringPercent} onChange={setAcquiringPercent} />
              </div>
            </Section>

            <Section label="Маржа">
              <Field
                label="Целевая маржа"
                suffix="% от цены"
                value={marginPercent}
                onChange={setMarginPercent}
                hint={
                  masterType === "margin_share"
                    ? "Общая маржа заказа — из неё мастер получит свою долю"
                    : "Ваша прибыль как доля от итоговой цены клиенту"
                }
              />
            </Section>
          </div>

          {/* Ticket */}
          <div className="order-1 md:order-2 md:sticky md:top-8">
            <div
              className="rounded-2xl border p-5 relative overflow-hidden"
              style={{ background: colors.panel, borderColor: colors.border }}
            >
              <div className="flex items-center justify-between mb-3">
                <span
                  className="text-xs"
                  style={{ color: colors.textFaint, fontFamily: "'IBM Plex Mono', monospace" }}
                >
                  ТИКЕТ №{ticketNo}
                </span>
                <span
                  className="inline-block w-2 h-2 rounded-full"
                  style={{ background: colors.accent, animation: "pulseDot 1.8s infinite" }}
                />
              </div>

              <input
                value={serviceName}
                onChange={(e) => setServiceName(e.target.value)}
                placeholder="Ремонт техники"
                className="w-full bg-transparent outline-none text-sm mb-4"
                style={{ color: colors.text, fontFamily: "'Manrope', sans-serif", fontWeight: 600 }}
              />

              <div
                style={{
                  borderTop: `2px dashed ${colors.borderSoft}`,
                  marginBottom: "16px",
                }}
              />

              {calc.valid ? (
                <>
                  <div
                    className="text-xs uppercase tracking-wide mb-1"
                    style={{ color: colors.textMuted, fontFamily: "'IBM Plex Mono', monospace" }}
                  >
                    Цена для клиента
                  </div>
                  <div
                    className="text-4xl mb-4"
                    style={{ color: colors.accent, fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700 }}
                  >
                    {fmt(calc.price)} <span className="text-xl">{CUR}</span>
                  </div>
                </>
              ) : (
                <div
                  className="text-sm mb-4 rounded-lg p-3"
                  style={{ color: colors.red, background: "rgba(241,96,99,0.1)", border: `1px solid ${colors.red}` }}
                >
                  Налог + эквайринг + маржа ≥ 100%. Снизьте проценты, чтобы цену можно было рассчитать.
                </div>
              )}

              <button
                onClick={() => setShowBreakdown((v) => !v)}
                className="text-xs"
                style={{ color: colors.textFaint, fontFamily: "'Manrope', sans-serif", fontWeight: 600 }}
              >
                {showBreakdown ? "Скрыть расчёт ▴" : "Показать расчёт ▾"}
              </button>

              {showBreakdown && calc.valid && (
                <div className="mt-3 flex flex-col gap-1.5 text-xs" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
                  {[
                    ["Мастер", calc.masterAmount],
                    ["Запчасти", Number(partsCost) || 0],
                    ["Аренда на заказ", calc.rentPerOrder],
                    ["Налог", calc.taxAmount],
                    ["Эквайринг", calc.acqAmount],
                    ["Ваша прибыль", calc.ownerAmount],
                  ].map(([k, v]) => (
                    <div key={k} className="flex justify-between">
                      <span style={{ color: colors.textFaint }}>{k}</span>
                      <span style={{ color: colors.textMuted }}>{fmt(v)} {CUR}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<RepairPriceCalculator />);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
